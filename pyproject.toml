[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "titan"
version = "0.1.0"
description = "Project TITAN — autonomous quantitative research and trading OS"
requires-python = ">=3.12"
dependencies = [
    "ibapi>=9.81",
    "nautilus_trader",
    "pandas",
    "numpy",
    "scipy",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "alpaca-py>=0.44.0",
    "pytest>=9.1.1",
    "websockets>=17.1",
    "yfinance>=1.7.0",
    "requests>=2.34.2",
    "cryptography>=50.0.1",
    "peewee>=4.4.0",
    "ib-insync>=0.9.86",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "titan._core"
manifest-path = "core/Cargo.toml"
python-source = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
markers = [
    "live: tests that require live Alpaca paper API credentials",
    "benchmark: performance/throughput benchmarks not run in CI",
    "paper_order: tests that place real paper orders (one-share certification); requires --run-paper-orders",
]
