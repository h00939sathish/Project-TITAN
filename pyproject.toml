[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "titan"
version = "0.1.0"
description = "Project TITAN — autonomous quantitative research and trading OS"
requires-python = ">=3.12"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "titan._core"
manifest-path = "core/Cargo.toml"
python-source = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
