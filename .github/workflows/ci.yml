name: CI

# The repository trunk is `master` (git remote HEAD -> origin/master). The
# previous `[main]` trigger matched no branch, so this workflow never ran.
# See ADR-034.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo check --manifest-path core/Cargo.toml
      - run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install maturin pytest ruff mypy
      - run: maturin build --release --manifest-path core/Cargo.toml
      - run: pip install target/wheels/*.whl
      # ADVISORY (non-blocking): `mypy --strict` currently reports 387 errors
      # (117 in the execution/risk/data/backtest core). Enabling it as a hard
      # gate would turn trunk permanently red. It is reported for visibility
      # until the ratchet-to-blocking plan in ADR-034 completes. `ruff` is
      # installed but likewise not yet enforced (1580 violations) — see ADR-034.
      - name: Type check (advisory — ADR-034)
        run: mypy src/titan tests/
        continue-on-error: true
      - run: python scripts/check_adr_gate.py
      - run: pytest tests/
      - name: Throughput benchmark
        run: python -m pytest tests/replay/test_throughput.py --no-header -q

